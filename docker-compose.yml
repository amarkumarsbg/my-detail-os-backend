# Local PostgreSQL for development (`npm run db:up` from backend/).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mydetailos
      POSTGRES_PASSWORD: mydetailos
      POSTGRES_DB: mydetailos
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - my_detail_os_pg:/var/lib/postgresql/data

volumes:
  my_detail_os_pg:
